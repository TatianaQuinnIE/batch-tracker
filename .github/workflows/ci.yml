name: CI

# Every push (any branch) and every pull request: lint, test with coverage, build images.
# CI never connects to Azure SQL: tests use a throwaway SQL Server container.
on:
  push:
  pull_request:

# A newer push to the same branch cancels the run that is still going (as in the
# class CI exercise), so only the latest commit uses runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  describe:
    # The machine-readable system description must be valid: each openapi.yaml against
    # the OpenAPI specification. (Each service's tests also check its document against
    # its real routes and responses, and feedback checks the batches document it calls.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openapi-spec-validator==0.9.0
      - name: Validate the OpenAPI documents
        run: openapi-spec-validator services/batches/openapi.yaml services/feedback/openapi.yaml

  test:
    name: test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [batches, feedback]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements-dev.txt

      - name: Start a throwaway SQL Server
        # Random password generated for this run only and masked in the logs,
        # so no database password is written in this file or stored anywhere.
        run: |
          SA_PASSWORD="Ci-$(openssl rand -hex 16)-Aa1"
          echo "::add-mask::$SA_PASSWORD"
          docker run -d --name mssql -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$SA_PASSWORD" \
            -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          echo "TEST_DATABASE_URL=mssql://sa:${SA_PASSWORD}@localhost:1433/master" >> "$GITHUB_ENV"
          for _ in $(seq 1 60); do
            if docker exec mssql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA_PASSWORD" \
                 -Q "SELECT 1" -b -o /dev/null; then exit 0; fi
            sleep 2
          done
          docker logs mssql
          exit 1

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check --config ../../ruff.toml .

      - name: Test with coverage (fails under 70% on the core logic)
        # Core logic = the domain package (service.py, routes.py), the migration runner
        # and the connection code. app.py wiring is exercised but not counted.
        run: >
          pytest --cov=${{ matrix.service }} --cov=migrate --cov=db
          --cov-report=term-missing --cov-fail-under=70

  images:
    # Build every service image on every push and PR, so a broken Dockerfile fails CI.
    # Images are pushed to GHCR, tagged with the commit SHA, only on main.
    needs: [test, describe]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [batches, feedback]
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name (GHCR needs lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/batch-tracker-${{ matrix.service }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
